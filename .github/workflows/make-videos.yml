name: Gerar vídeos curtos (Reels/TikTok/Shorts)

on:
  # Roda logo depois que a atualização do catálogo termina (disparada todo dia
  # de manhã pelo cron-job.org). O agendador do GitHub atrasava horas, por isso não é usado aqui.
  workflow_run:
    workflows: ['Atualizar catálogo (preços e estoque)']
    types: [completed]
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Quantos vídeos gerar agora (1 a 5)'
        required: false
        default: '3'

concurrency:
  group: make-videos
  cancel-in-progress: false

jobs:
  make-videos:
    # Só gera vídeos depois da atualização diária do catálogo (ou quando disparado à mão).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_VIDEO_CHAT_ID: ${{ secrets.TELEGRAM_VIDEO_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ffmpeg e o desenho das telas vêm prontos do npm (segundos), sem apt-get (que levava 9+ min).
      - name: Preparar ferramentas de vídeo
        run: |
          npm install --no-save --no-audit --no-fund ffmpeg-static@5 ffprobe-static@3 @resvg/resvg-js@2
          echo "FFMPEG_PATH=$(node -p "require('ffmpeg-static')")" >> "$GITHUB_ENV"
          echo "FFPROBE_PATH=$(node -p "require('ffprobe-static').path")" >> "$GITHUB_ENV"
          fc-list | grep -qi dejavu && echo "Fonte DejaVu disponível." || echo "::warning::Fonte DejaVu não encontrada."

      - run: npm run videos:make -- --quantidade=${{ github.event.inputs.quantidade || '3' }}

      - name: Guardar cópia dos vídeos (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: videos/*.mp4
          retention-days: 7
          if-no-files-found: ignore
