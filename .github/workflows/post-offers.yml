name: Publicar ofertas no Telegram

on:
  schedule:
    # 1 post por hora, das 8h37 às 22h37 em Mato Grosso do Sul (UTC-4) = 15 por dia.
    - cron: '37 12-23 * * *'
    - cron: '37 0-2 * * *'
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Quantas ofertas publicar agora'
        required: false
        default: '1'

concurrency:
  group: post-offers
  cancel-in-progress: false

jobs:
  post-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      SITE_URL: https://www.vitalinotech.com.br
      OFFER_REPOST_AFTER_DAYS: '5'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run offers:post -- --quantidade=${{ github.event.inputs.quantidade || '1' }}
