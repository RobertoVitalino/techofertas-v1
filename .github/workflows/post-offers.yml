name: Publicar ofertas no Telegram

on:
  schedule:
    # Horário de Mato Grosso do Sul (UTC-4): 09h37, 12h37 e 19h37.
    - cron: '37 13 * * *'
    - cron: '37 16 * * *'
    - cron: '37 23 * * *'
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Quantas ofertas publicar agora'
        required: false
        default: '1'

concurrency:
  group: post-offers
  cancel-in-progress: false

jobs:
  post-offers:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      SITE_URL: https://www.vitalinotech.com.br
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run offers:post -- --quantidade=${{ github.event.inputs.quantidade || '1' }}
