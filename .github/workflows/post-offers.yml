name: Publicar ofertas no Telegram

# O agendador do GitHub atrasa ou pula execuções frequentes (de hora em hora).
# Por isso, cada execução fica rodando em "modo contínuo": publica 1 oferta por
# hora (8h37 às 22h37 de MS) e, perto do limite de 6 h, inicia a próxima sozinha.
# Os horários abaixo só servem para dar a partida (e de reserva, caso a corrente
# se quebre). Posts duplicados são evitados pelo próprio script.

on:
  schedule:
    - cron: '37 10 * * *' # 06h37 MS: começa o turno do dia (espera até 8h37)
    - cron: '7 15 * * *'  # 11h07 MS: reserva
    - cron: '7 19 * * *'  # 15h07 MS: reserva
    - cron: '7 23 * * *'  # 19h07 MS: reserva
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Publicar agora essa quantidade (deixe vazio para o modo contínuo)'
        required: false
        default: ''

concurrency:
  group: post-offers
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  post-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      SITE_URL: https://www.vitalinotech.com.br
      OFFER_REPOST_AFTER_DAYS: '5'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Publicar agora (quantidade manual)
        if: github.event_name == 'workflow_dispatch' && inputs.quantidade != ''
        run: npm run offers:post -- --quantidade=${{ github.event.inputs.quantidade }}

      - name: Modo contínuo (1 post por hora)
        id: loop
        if: github.event_name != 'workflow_dispatch' || inputs.quantidade == ''
        run: npm run offers:post -- --loop

      - name: Continuar em uma nova execução
        if: steps.loop.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run post-offers.yml --ref ${{ github.ref_name }}
